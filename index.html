<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gerardo — Pendientes</title>
<style>
  :root { --bg: #0f1218; --card: #181c24; --border: #282e3d; --accent: #3b82f6; --text: #f3f4f6; --text-dim: #9ca3af; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
  body { background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 90px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  h1 { font-size: 18px; font-weight: 800; }
  .badge-date { font-size: 12px; color: var(--text-dim); }
  
  /* Secciones estilo PDF */
  .group-title { font-size: 14px; font-weight: 800; color: var(--accent); margin: 20px 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; text-transform: uppercase; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
  .task-item { display: flex; align-items: flex-start; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .task-item:last-child { border-bottom: none; }
  .task-id { color: var(--text-dim); font-weight: bold; width: 24px; }
  .task-desc { flex: 1; margin-right: 10px; line-height: 1.4; }
  .task-days { font-size: 11px; color: var(--text-dim); white-space: nowrap; }

  /* Barra inferior */
  .action-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15,18,24,0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--border); padding: 12px 16px; display: flex; gap: 10px; z-index: 100; }
  .btn { flex: 1; border: none; border-radius: 10px; padding: 12px; font-weight: 700; font-size: 14px; cursor: pointer; text-align: center; }
  .btn-main { background: var(--accent); color: white; }
  .btn-sec { background: var(--card); border: 1px solid var(--border); color: var(--text); }
  
  .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 20px;}
  .loading-overlay.active { display: flex; }
  .spinner { border: 4px solid var(--border); border-top: 4px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px;}
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div>
    <h1>Gerardo — Pendientes</h1>
    <div class="badge-date">Vista Previa Organizada</div>
  </div>
  <button class="btn btn-sec" style="flex: unset; padding: 8px 12px;" onclick="descargarPDF()">📄 Exportar PDF</button>
</header>

<div id="boardContainer">
  <!-- Aquí se dibujarán las tareas agrupadas por persona automáticamente -->
</div>

<div class="action-bar">
  <input type="file" id="photoInput" accept="image/*" capture="environment" style="display: none;" onchange="procesarFoto(event)">
  <button class="btn btn-main" onclick="document.getElementById('photoInput').click()">📸 Subir Foto y Procesar</button>
</div>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <h3>Analizando con IA...</h3>
  <p style="font-size: 12px; color: var(--text-dim); margin-top: 8px;">El servidor puede tardar 50s en despertar.<br>Por favor, no cierres esta pantalla.</p>
</div>

<script>
  // URL ya actualizada con tu servidor
  const BACKEND_URL = "https://pendientes-backend.onrender.com";

  let equipo = ["GERARDO", "CRIS", "MARIO", "HÉCTOR", "GRACIA", "INGRID", "JULIO"];

  async function cargarTablero() {
    try {
      const res = await fetch(`${BACKEND_URL}/api/data`);
      const db = await res.json();
      renderizarTablero(db.pendientes);
    } catch (e) {
      console.log("Servidor dormido o URL incorrecta.");
    }
  }

  function renderizarTablero(pendientes) {
    const container = document.getElementById('boardContainer');
    container.innerHTML = "";

    equipo.forEach(miembro => {
      const tareasPersona = pendientes.filter(p => p.asignado_a === miembro);
      if (tareasPersona.length > 0) {
        let html = `<div class="group-title">${miembro} (${tareasPersona.length})</div><div class="card">`;
        tareasPersona.forEach(t => {
          html += `
            <div class="task-item">
              <span class="task-id">${t.id}.</span>
              <span class="task-desc">${t.descripcion}</span>
              <span class="task-days">${t.dias}</span>
            </div>`;
        });
        html += `</div>`;
        container.innerHTML += html;
      }
    });
  }

  async function procesarFoto(event) {
    const file = event.target.files[0];
    if (!file) return;

    document.getElementById('loading').classList.add('active');

    const formData = new FormData();
    formData.append("file", file);

    try {
      const response = await fetch(`${BACKEND_URL}/procesar-hoja`, {
        method: "POST",
        body: formData
      });
      const res = await response.json();
      
      if (res.status === "success") {
        renderizarTablero(res.data.pendientes);
        alert("✅ Listo. Revisa las tareas agrupadas en pantalla. Si todo está correcto, presiona Exportar PDF.");
      }
    } catch (error) {
      alert("Error de conexión. Verifica que el servidor en Render esté activo.");
    } finally {
      document.getElementById('loading').classList.remove('active');
    }
  }

  function descargarPDF() {
    window.open(`${BACKEND_URL}/descargar-pdf`, '_blank');
  }

  // Cargar datos al entrar
  cargarTablero();
</script>
</body>
</html>
