<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gerardo — Gestor de Pendientes & Equipo</title>
<style>
  :root {
    --bg: #0f1218;
    --card: #181c24;
    --border: #282e3d;
    --accent: #3b82f6;
    --text: #f3f4f6;
    --text-dim: #9ca3af;
    --danger: #ef4444;
    --success: #10b981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 90px; }
  
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  h1 { font-size: 18px; font-weight: 800; }
  .badge-date { font-size: 12px; color: var(--text-dim); }

  .section-title { font-size: 14px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; margin: 16px 0 8px; letter-spacing: .05em; }
  
  .team-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 6px 12px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .chip .remove { color: var(--danger); cursor: pointer; font-weight: bold; margin-left: 4px; }
  .btn-add-chip { background: var(--accent); color: white; border: none; border-radius: 20px; padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .task-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .task-item:last-child { border-bottom: none; }
  .task-info { display: flex; align-items: center; gap: 10px; }
  .task-tag { font-size: 10px; font-weight: 800; background: #2563eb22; color: var(--accent); padding: 2px 6px; border-radius: 4px; }

  .action-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15,18,24,0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--border); padding: 12px 16px; display: flex; gap: 10px; z-index: 100; }
  .btn-main { flex: 1; background: var(--accent); color: white; border: none; border-radius: 10px; padding: 12px; font-weight: 700; font-size: 14px; cursor: pointer; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-sec { background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 12px; font-weight: 600; font-size: 14px; cursor: pointer; }
  
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
  .modal.active { display: flex; }
  .modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 400px; padding: 20px; }
  .modal-box input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 8px; margin: 12px 0; font-size: 14px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Gerardo — Pendientes</h1>
    <div class="badge-date">Semana Activa · Septiembre 2026</div>
  </div>
  <button class="btn-sec" onclick="descargarPDF()">📄 PDF</button>
</header>

<div class="section-title">Miembros del Equipo</div>
<div class="team-grid" id="teamContainer"></div>

<div class="section-title">Vista Previa de Tareas</div>
<div class="card" id="taskList">
  <div class="task-item">
    <div class="task-info">
      <span class="task-tag">GERARDO</span>
      <span>Seguimiento Computadoras</span>
    </div>
    <span style="font-size: 11px; color: var(--text-dim);">Hoy</span>
  </div>
  <div class="task-item">
    <div class="task-info">
      <span class="task-tag">JULIO</span>
      <span>Revisión de informes</span>
    </div>
    <span style="font-size: 11px; color: var(--text-dim);">0d</span>
  </div>
</div>

<div class="action-bar">
  <input type="file" id="photoInput" accept="image/*" capture="environment" style="display: none;" onchange="procesarFoto(event)">
  <button class="btn-main" onclick="document.getElementById('photoInput').click()">
    📸 Subir Foto de Hoja
  </button>
</div>

<div class="modal" id="addMemberModal">
  <div class="modal-box">
    <h3>Agregar Miembro al Equipo</h3>
    <input type="text" id="newMemberName" placeholder="Nombre (ej. DANIEL)">
    <div style="display: flex; gap: 8px;">
      <button class="btn-main" onclick="confirmAddMember()">Guardar</button>
      <button class="btn-sec" onclick="closeModal()">Cancelar</button>
    </div>
  </div>
</div>

<script>
  const BACKEND_URL = "https://pendientes-backend.onrender.com";
  let equipo = ["GERARDO", "CRIS", "MARIO", "HÉCTOR", "GRACIA", "INGRID", "JULIO"];

  function renderTeam() {
    const container = document.getElementById('teamContainer');
    container.innerHTML = equipo.map(m => `
      <div class="chip">
        ${m}
        ${m !== 'GERARDO' ? `<span class="remove" onclick="removeMember('${m}')">&times;</span>` : ''}
      </div>
    `).join('') + `<button class="btn-add-chip" onclick="openModal()">+ Agregar</button>`;
  }

  function openModal() { document.getElementById('addMemberModal').classList.add('active'); }
  function closeModal() { document.getElementById('addMemberModal').classList.remove('active'); }

  function confirmAddMember() {
    const input = document.getElementById('newMemberName');
    const name = input.value.trim().toUpperCase();
    if (name && !equipo.includes(name)) {
      equipo.push(name);
      renderTeam();
      input.value = '';
      closeModal();
    }
  }

  function removeMember(name) {
    equipo = equipo.filter(m => m !== name);
    renderTeam();
  }

  async function procesarFoto(event) {
    const file = event.target.files[0];
    if (!file) return;

    const formData = new FormData();
    formData.append("file", file);

    alert("📸 Subiendo y analizando hoja con IA en Render...");

    try {
      const response = await fetch(`${BACKEND_URL}/procesar-hoja`, {
        method: "POST",
        body: formData
      });

      const res = await response.json();

      if (res.status === "success") {
        alert("✅ Hoja procesada con éxito: Tareas completadas eliminadas, manuscritas agregadas y hábitos actualizados.");
        descargarPDF();
      } else {
        alert("Ocurrió un error al analizar la hoja.");
      }
    } catch (error) {
      console.error(error);
      alert("Error al conectar con el servidor de Render.");
    }
  }

  function descargarPDF() {
    window.open(`${BACKEND_URL}/descargar-pdf`, '_blank');
  }

  renderTeam();
</script>
</body>
</html>
